name: Weekly AI Business Briefing

on:
  schedule:
    # 0 7 * * 1 = Monday 07:00 UTC = Sunday 11:00 PM PST (UTC-8)
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  generate-briefings:
    name: Generate briefings for all active tenants
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly-briefing edge function
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_URL }}/functions/v1/weekly-briefing")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          echo "Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "Error: unexpected status $http_code"
            exit 1
          fi

          echo "$body" | jq .
